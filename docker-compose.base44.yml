services:
  app:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
      - pip-cache:/root/.cache/pip
      - hf-cache:/cache/hf
      - mock-artifacts:/mock-artifacts
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - HF_HOME=/cache/hf
      - TOKENIZERS_PARALLELISM=false
      # Stand-in models/embeddings (real ones are Git LFS objects missing from
      # the GitHub remote). Drop this line once artifacts/ holds the real files.
      - NAVIO_ARTIFACT_DIR=/mock-artifacts
    env_file:
      - path: /run/base44/app.env   # platform secrets (HF_TOKEN) — always wins
        required: false
    ports:
      - "3000:7860"
    command: >
      sh -c "pip install torch --index-url https://download.pytorch.org/whl/cpu
      && pip install -r requirements.txt
      && python scripts/make_mock_artifacts.py
      && gradio app.py"

volumes:
  pip-cache:
  hf-cache:
  mock-artifacts:
